name: opengym-dev
services:
  api:
    image: opengym-personal-api:${PERSONAL_TAG:-dev}
    build:
      context: ../../api
      target: default
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATA_DIR: /data
      RP_ID: ${PERSONAL_RP_ID:-localhost}
      ORIGIN: ${PERSONAL_ORIGIN:-http://localhost:8081}
      RP_NAME: OpenGym Personal Test
      FIRST_USER_ADMIN: '1'
      ALLOW_GUEST: '0'
      INVITE_ONLY: '0'
      PASSWORD_LOGIN: '0'
      TRUST_PROXY: '1'
      AUDIT_LOG: '1'
      COACH_DISABLED: ${PERSONAL_COACH_DISABLED:-1}
    volumes:
      - ${PERSONAL_DATA_ROOT:-../../.local-test}/data:/data
      - ${PERSONAL_DATA_ROOT:-../../.local-test}/coach-auth:/coach-auth
    networks: [personal]
  web:
    image: opengym-personal-web:${PERSONAL_TAG:-dev}
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        APP_BUILD: personal-${PERSONAL_TAG:-dev}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - '${PERSONAL_BIND:-127.0.0.1}:${PERSONAL_WEB_PORT:-8081}:80'
    environment:
      NGINX_PORT: '80'
      BACKEND: api
      PORT: '3000'
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ''
      BASE_PATH: ''
      MEDIA_UPLOAD_MAX: 48m
    networks: [personal]
networks:
  personal: {}
